<div class="appointment-step category-step active" data-step='0'>
    <h3>Como podemos cuidar de você hoje?</h3>
    <div class="category-buttons">
        {% for category in categories %}
            <button class="category-btn btn" data-category-id="{{ category.id }}">
                {{category.name}}
            </button>
        {% endfor %}
    </div>
</div>

<div class="appointment-step service-step" data-step='1'>
    <h3>Escolha o serviço</h3>
    <p>Selecione o serviço que deseja realizar.</p>
    <div class="services-btns">
        {% for service in services %}
        <button class="appointment-service-btn appointment-step-btn"
         data-category-id="{{ service.category.id }}"
         data-service-id="{{ service.id }}">
            {{ service.name }}
        </button>
        {% endfor %}
    </div>
    <div class="back-next-step-btn">
        <button class="back-btn appointment-step-btn">
            Voltar
        </button>
        <button class="next-btn appointment-step-btn">
            Continuar
        </button>
    </div>
</div>

<div class="appointment-step date-step" data-step='2'>
    <div class="date-step-content">
        <h3>Escolha a data</h3>
        <div class="calendar-container">
            <div class="date-input">
                <input class="appointment-date-visible" type="text" id="appointment-date" placeholder="Selecione uma data">
                <i class="fa-solid fa-calendar"></i>
            </div>
        </div>
        <div class="time-slots-container">
        </div>
        <div class="back-next-step-btn">
            <button class="back-btn appointment-step-btn" id="date-back-btn">
                Voltar
            </button>
            <button class="next-btn appointment-step-btn" id="date-next-btn">
                Continuar
            </button>
        </div>
    </div> 
</div>

<div class="appointment-step photo-step" data-step='3'>
    <div class="photo-step-content">
        <h3>Escolha uma foto de inspiração</h3>
        <div class="photo-content">
           <label for="photo-input">
                <i class="fa-regular fa-image photo-placeholder-icon"></i>
                <span class="photo-placeholder-text">
                    Nenhuma imagem selecionada
                </span>
                <img id="preview-img" class="preview-img" alt="">
            </label>
            <input type="file" name="photo" id="photo-input" accept="image/*">     
        </div>
    </div>
    <div class="back-next-step-btn">
        <button class="back-btn appointment-step-btn">
            Voltar
        </button>
        <button class="next-btn appointment-step-btn" id="photo-next-btn">
            Pular
        </button>
    </div>
</div>

<div class="appointment-step confirm-step" data-step='4'>
    <div class="back-next-step-btn">
        <div class="comfirm-step-infos">
            <p class="service-name"></p>           
        </div>
        <button class="back-btn appointment-step-btn">
            Voltar
        </button>
    </div>
</div>
