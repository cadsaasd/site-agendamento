<article class="service-card">
    <div class="card-inner">
        <!-- frente do card -->
        <div class="first-service-content">
            <h3>{{service.nome}}</h3>
        </div>

        <!-- verso do card -->
        <div class="second-service-content">
            <h3>{{service.descricao}}</h3>  
            <div class="service-details">
                <span class="service-price">R${{service.preco}}</span>
                <span class="service-duration">{{service.duracao}} Min</span>
            </div>
        </div>
    </div>
</article>
