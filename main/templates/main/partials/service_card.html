<article class="service-card">

    <div class="service-card-content">

        <h3>{{ service.name }}</h3>

        <p class="service-description">
            {{ service.description }}
        </p>

        <div class="service-details">

            <span class="service-price">
                R${{ service.price }}
            </span>

            <span class="service-duration">
                {{ service.format_duration }}
            </span>

        </div>

    </div>

</article>
