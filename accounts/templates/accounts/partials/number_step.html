<section class="account-step active" data-step="0" aria-labelledby="login-title">
    <header class="login-header">
        <h1 id="login-title">Entrar</h1>
        <p>Digite seu número de celular para continuar</p>
    </header>
    <div class="form-group">
        <label for="phone">Celular</label>
        <div class="input-content">
            <input type="tel" id="phone" name="phone" placeholder="(11) 91234-5678" autocomplete="tel" required>
            <i class="fa-solid fa-phone" aria-hidden="true"></i>
        </div>
    </div>
    <div class="button-content">
        <button class="btn auth-next-btn" type="button">Enviar código</button>
    </div>
</section>
