<section class="account-step" data-step="2" aria-labelledby="register-title" hidden>
    <header class="login-header">
        <h1 id="register-title">Cadastro</h1>
        <p>Só mais um passo para te conhecer</p>
    </header>
    <div class="name-row">
        <div class="form-group">
            <label for="first-name">Nome</label>
            <div class="input-content">
                <input type="text" id="first-name" name="first_name" placeholder="Maria" autocomplete="given-name" required>
                <i class="fa-solid fa-user" aria-hidden="true"></i>
            </div>
        </div>
        <div class="form-group">
            <label for="last-name">Sobrenome</label>
            <div class="input-content">
                <input type="text" id="last-name" name="last_name" placeholder="Silva" autocomplete="family-name" required>
                <i class="fa-solid fa-user" aria-hidden="true"></i>
            </div>
        </div>
    </div>
    <div class="button-content account-actions">
        <button type="button">Concluir cadastro</button>
    </div>
</section>
